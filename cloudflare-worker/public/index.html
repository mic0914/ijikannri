/* 漁港版スパン画面：港湾版のレイアウトに合わせる */
.fishery-port-hero,.fishery-port-photo-card,.fishery-port-notes-card{max-width:1120px;margin-left:auto;margin-right:auto}
.fishery-port-photo-card .photos{margin-top:12px}
.fishery-port-photo-card .photo,.fishery-port-photo-card .upload{border-radius:10px}
.fishery-port-notes-card .notes{display:block;width:100%;min-height:110px;margin-top:8px}
@media(max-width:800px){
  .fishery-port-hero,.fishery-port-photo-card,.fishery-port-notes-card{margin-bottom:12px}
  .fishery-port-photo-card .photos{grid-template-columns:1fr}
}

/* 漁港版テーマ：港湾版レイアウトに合わせ、青を基調に統一 */
body:not(.port-mode) .header{
  background:linear-gradient(110deg,#123b55,#176f91);
  padding:12px 18px;
}
body:not(.port-mode) .header>.header-row{
  max-width:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
body:not(.port-mode) .header>.header-row h1{font-size:18px;margin:0}
body:not(.port-mode) #save-state{
  background:#fff;
  color:#155675;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
body:not(.port-mode) .header>.tools{
  max-width:none;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:9px;
}
body:not(.port-mode) .header>.tools .btn,
body:not(.port-mode) .header>.tools label.btn{
  border:0;
  border-radius:9px;
  background:#fff;
  color:#155675;
  padding:8px 11px;
  font-family:inherit;
  font-size:14px;
  line-height:1.2;
  font-weight:800;
  cursor:pointer;
  min-height:auto;
}
body:not(.port-mode) .header>.tools #reset-all{color:#a51d16}
body:not(.port-mode) .header>.tools .app-version{
  font-size:12px!important;
  margin-left:auto;
  width:auto;
  min-height:0;
}
body:not(.port-mode) .layout{grid-template-columns:240px minmax(0,1fr)}
body:not(.port-mode) .side{
  border-right:1px solid #cbdde6;
  padding:14px;
}
body:not(.port-mode) .nav{gap:6px}
body:not(.port-mode) .nav button{
  background:#f3f8fb;
  color:#31596b;
  padding:11px;
  font-weight:800;
}
body:not(.port-mode) .nav button:hover,
body:not(.port-mode) .nav button.active{
  background:#dceef7;
  color:#123f59;
}
body:not(.port-mode) .main{padding:22px}
body:not(.port-mode) .hero{
  background:linear-gradient(120deg,#173f59,#2584ad);
}
body:not(.port-mode) .card{
  border-color:#cadde6;
  box-shadow:0 5px 18px #173b4f0e;
}
body:not(.port-mode) .fishery-port-hero{
  background:linear-gradient(120deg,#173f59,#2584ad)!important;
}
body:not(.port-mode) .fishery-port-photo-card,
body:not(.port-mode) .fishery-port-notes-card{
  border-color:#cadde6!important;
  box-shadow:0 5px 18px #173b4f0e!important;
}
body:not(.port-mode) input:focus,
body:not(.port-mode) select:focus,
body:not(.port-mode) textarea:focus{
  border-color:#1c7ba2;
  box-shadow:0 0 0 3px #1c7ba21c;
}
body:not(.port-mode) .upload.dragover{
  border-color:#176f91;
  background:#e3f3f9;
  box-shadow:0 0 0 3px #176f9126;
}
@media(max-width:800px){
  body:not(.port-mode) .header{position:relative}
  body:not(.port-mode) .header>.header-row{display:flex;flex-direction:row;align-items:center}
  body:not(.port-mode) .header>.tools{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    width:100%;
    overflow:visible;
  }
  body:not(.port-mode) .header>.tools>*{width:100%;min-width:0}
  body:not(.port-mode) .header>.tools .app-version{grid-column:1/-1;text-align:right}
  body:not(.port-mode) .side{top:0}
}

/* 漁港版スパン見出し・入力状況 */
body:not(.port-mode) .fishery-port-hero h2{
  font-size:18px;
  line-height:1.3;
  margin:0;
}
body:not(.port-mode) .fishery-port-completion-card{
  border-color:#cadde6;
  box-shadow:0 5px 18px #173b4f0e;
}
body:not(.port-mode) .fishery-span-check-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
body:not(.port-mode) .fishery-span-check-grid>div{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid #d3e2e9;
  border-radius:10px;
  background:#f7fbfd;
  padding:11px 12px;
  font-size:13px;
  font-weight:800;
  color:#31596b;
}
body:not(.port-mode) .fishery-span-check{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  border-radius:999px;
  padding:3px 8px;

body:not(.port-mode) .fishery-span-check.done{

}

  color:#8a4c11;
}

  color:#31596b;
}
body:not(.port-mode) .fishery-span-check-summary{margin-top:12px}

/* 漁港版：港湾版相当の「点検項目の進捗」 */
body:not(.port-mode) .fishery-progress-card{

  box-shadow:0 5px 18px #173b4f0e;
}
body:not(.port-mode) .fishery-progress-note{
  margin:-4px 0 10px;
  color:#58758a;
  font-size:12px;
}
body:not(.port-mode) .fishery-progress-list{
  display:grid;
  gap:7px;
}
body:not(.port-mode) .fishery-progress-row.upload{
  width:100%;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border:1px solid #cbdde6;
  border-radius:8px;
  background:#fff;
  color:inherit;
  text-align:left;
  cursor:pointer;
}

  border-color:#6ba9c4;
  background:#f3f9fc;
}
body:not(.port-mode) .fishery-progress-row.upload:active{
  transform:translateY(1px);
}
body:not(.port-mode) .fishery-progress-row.upload.done{
  border-color:#9cc9db;
  background:#f3fafd;
}
body:not(.port-mode) .fishery-progress-row.upload.working{
  border-color:#d8b785;
  background:#fffaf3;
}
body:not(.port-mode) .fishery-progress-item{
  display:block;
  font-size:14px;
  font-weight:800;
  color:#155675;
}
body:not(.port-mode) .fishery-progress-hint{
  display:block;
  margin-top:3px;
  font-size:12px;
  color:#58758a;
}
body:not(.port-mode) .fishery-progress-status{
  font-weight:900;
  white-space:nowrap;
}
body:not(.port-mode) .fishery-progress-status.completed{color:#155675}
body:not(.port-mode) .fishery-progress-status.photos{color:#8a4c11}
body:not(.port-mode) .fishery-progress-status.pending{color:#7a858b}
body:not(.port-mode) .fishery-progress-row input[type=file]{display:none}

/* 漁港版：点検項目の進捗の項目名を左端寄せ */
body:not(.port-mode) .fishery-progress-row.upload{
  justify-items:stretch;
}
body:not(.port-mode) .fishery-progress-row.upload>span:first-child{
  display:block;
  min-width:0;
  text-align:left;
  justify-self:stretch;
}
body:not(.port-mode) .fishery-progress-item{
  text-align:left;
  margin-left:0;
  padding-left:0;
}

 const oldPoints=f.points||[],oldZones=f.zones||[],ranges=zoneRanges(f.length),count=ranges.length;
 f.zones=ranges.map((range,i)=>{const sources=preserve?(i===count-1&&oldZones.length>count?oldZones.slice(i):oldZones[i]?[oldZones[i]]:[]):[],prev=sources[0],notes=[...new Set(sources.map(x=>x.notes).filter(Boolean))].join('\n'),photos=[...new Map(sources.flatMap(x=>x.photos||[]).map(x=>[x.id,x])).values()].slice(0,12);return{id:prev?.id||uid(),number:i+1,start:range.start,end:range.end,notes,photos}});
 f.points=f.zones.map((z,i)=>{const sourceZones=preserve?(i===count-1&&oldZones.length>count?oldZones.slice(i):oldZones[i]?[oldZones[i]]:[]):[],sourceIds=new Set(sourceZones.map(x=>x.id)),candidates=oldPoints.filter(p=>sourceIds.has(p.zoneId)),prev=candidates.find(p=>p.m1!==''&&p.m1!=null)||candidates[0]||null,max=candidates.filter(p=>p.m1!==''&&p.m1!=null).sort((a,b)=>Math.abs(num(b.m1))-Math.abs(num(a.m1)))[0],notes=[...new Set(candidates.map(x=>x.notes).filter(Boolean))].join('\n');return{id:prev?.id||uid(),number:i+1,distance:z.start,zoneId:z.id,m1:max?.m1??'',notes}})

const FISHERY_PHOTO_DB='ijikannri-fishery-photos-v1',FISHERY_PHOTO_STORE='photos';

function openFisheryPhotoDb(){

    request.onblocked=()=>reject(Error('漁港写真データベースの更新がほかの画面でブロックされています'));

function fisheryDataUrlToBlob(data){
  const match=String(data||'').match(/^data:([^;,]+);base64,(.+)$/);

}

async function fisheryPhotoPut(id,data){

  const db=await openFisheryPhotoDb(),tx=db.transaction(FISHERY_PHOTO_STORE,'readwrite');

  await fisheryIdbTransaction(tx);fisheryPhotoPersisted.add(id);
}
async function fisheryPhotoGet(id){
  if(!id)return'';
  if(fisheryPhotoStoreOverride){const value=await fisheryPhotoStoreOverride.get(id);if(value)fisheryPhotoPersisted.add(id);return value||''}
  const db=await openFisheryPhotoDb(),tx=db.transaction(FISHERY_PHOTO_STORE,'readonly'),row=await fisheryIdbRequest(tx.objectStore(FISHERY_PHOTO_STORE).get(id));
  if(!row?.blob)return'';
  fisheryPhotoPersisted.add(id);
  return await fisheryBlobToDataUrl(row.blob);
}
async function fisheryPhotoDelete(id){

  if(fisheryPhotoStoreOverride){await fisheryPhotoStoreOverride.delete(id);return}
  const db=await openFisheryPhotoDb(),tx=db.transaction(FISHERY_PHOTO_STORE,'readwrite');
  tx.objectStore(FISHERY_PHOTO_STORE).delete(id);await fisheryIdbTransaction(tx);
}
async function fisheryPhotoClear(){
  fisheryPhotoPersisted.clear();

  const db=await openFisheryPhotoDb(),tx=db.transaction(FISHERY_PHOTO_STORE,'readwrite');
  tx.objectStore(FISHERY_PHOTO_STORE).clear();await fisheryIdbTransaction(tx);

async function hydrateFisheryPhotos(candidate,{migrateLegacy=true}={}){
  let migrated=false,missing=0;

function fisheryConcreteTypeFromDetail(detail){

}
function fisheryConcreteTypesForDirection(targetFacility,direction){
  const found=new Set();

    const type=fisheryConcreteTypeFromDetail(detail);if(type)found.add(type);

}
function fisheryConcreteVariantDirections(targetFacility){

function fisheryInferConcreteTypeSelections(f){

      const type=fisheryConcreteTypeFromDetail(ph.detail);if(type)found.add(type);

  }

}
function fisheryInferConcreteType(f){

  return values.length&&values.every(value=>value===values[0])?values[0]:'';
}

function fisheryNormalizeConcreteSelections(f,legacyGlobal=''){
  const before=JSON.stringify(f?.concreteTypeSelections||{}),current=f?.concreteTypeSelections&&typeof f.concreteTypeSelections==='object'&&!Array.isArray(f.concreteTypeSelections)?f.concreteTypeSelections:{},inferred=fisheryInferConcreteTypeSelections(f),next={};

function sortFisheryPhotosByInspectionProgress(f,z){
  const order=fisheryInspectionDirections(f),rank=new Map(order.map((item,index)=>[item,index]));
  z.photos=(z.photos||[]).map((photo,index)=>({photo,index})).sort((a,b)=>{
    const ar=rank.has(a.photo.direction)?rank.get(a.photo.direction):order.length;
    const br=rank.has(b.photo.direction)?rank.get(b.photo.direction):order.length;
    return ar-br||a.index-b.index;
  }).map(entry=>entry.photo);
  return z.photos;
}
function fisheryInspectionProgress(f,z){

  return required.map(item=>{
    const matched=photos.filter(ph=>ph.direction===item);
    const completed=matched.some(ph=>String(ph.detail||'').trim()&&String(ph.change||'').trim());
    return{item,status:completed?'completed':matched.length?'photos':'pending'};
  });
}

async function loadFisheryStateFromStorage(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x?.facilities?.length){
      state=x;let migrated=false;
      state.facilities.forEach(f=>{if(f.targetFacility==null){f.targetFacility='';migrated=true}if(!f.concreteTypeSelections||typeof f.concreteTypeSelections!=='object'||Array.isArray(f.concreteTypeSelections)){f.concreteTypeSelections={};migrated=true}if(fisheryNormalizeConcreteSelections(f,String(f.concreteType||'')))migrated=true;(f.zones||[]).forEach(z=>(z.photos||[]).forEach(ph=>{if(ph.detail==null){ph.detail='';migrated=true}const converted=defectText(ph.change||'');if(ph.change!==converted){ph.change=converted;migrated=true}}));const expected=zoneRanges(f.length),zoneLayoutMatches=Array.isArray(f.zones)&&f.zones.length===expected.length&&f.zones.every((z,i)=>Math.abs(num(z.start)-expected[i].start)<.001&&Math.abs(num(z.end)-expected[i].end)<.001),onePointPerZone=Array.isArray(f.zones)&&Array.isArray(f.points)&&f.points.length===f.zones.length&&f.zones.every((z,i)=>{const p=f.points[i];return p&&p.number===i+1&&p.zoneId===z.id&&Math.abs(num(p.distance)-num(z.start))<.001});if(!zoneLayoutMatches||!onePointPerZone){generate(f,true);migrated=true}});
      state.version=VERSION;

      return;
    }
    throw Error();
  }catch(err){
    if(err?.message&&err.message!=='Unexpected end of JSON input')console.warn('漁港保存データ読込',err);
    const f=freshFacility();generate(f,false);state.facilities=[f];state.activeFacilityId=f.id;
  }
}

let portPhotoStoreOverride=null;
let portPhotoDbPromise=null;
function setPortPhotoStoreForTests(store){portPhotoStoreOverride=store||null}
function portIdbRequest(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('写真保存データベースを操作できません'))})}
function portIdbTransaction(transaction){return new Promise((resolve,reject)=>{transaction.oncomplete=()=>resolve();transaction.onabort=()=>reject(transaction.error||Error('写真保存データベースの処理が中断されました'));transaction.onerror=()=>reject(transaction.error||Error('写真保存データベースを更新できません'))})}
function openPortPhotoDb(){if(portPhotoStoreOverride)return Promise.resolve(null);if(!global.indexedDB)return Promise.reject(Error('このブラウザでは写真保存データベースを利用できません'));if(!portPhotoDbPromise)portPhotoDbPromise=new Promise((resolve,reject)=>{const request=global.indexedDB.open(PORT_PHOTO_DB_NAME,PORT_PHOTO_DB_VERSION);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(PORT_PHOTO_STORE))db.createObjectStore(PORT_PHOTO_STORE)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('写真保存データベースを開けません'));request.onblocked=()=>reject(Error('写真保存データベースの更新がブロックされています'))});return portPhotoDbPromise}
async function portPhotoBlobPut(photoId,blob){if(!(blob instanceof Blob))throw Error('写真画像をBlobとして保存できません');if(portPhotoStoreOverride)return portPhotoStoreOverride.put(photoId,blob);const db=await openPortPhotoDb(),tx=db.transaction(PORT_PHOTO_STORE,'readwrite'),done=portIdbTransaction(tx);await Promise.all([portIdbRequest(tx.objectStore(PORT_PHOTO_STORE).put(blob,photoId)),done]);return blob}
async function portPhotoBlobGet(photoId){if(portPhotoStoreOverride)return portPhotoStoreOverride.get(photoId);const db=await openPortPhotoDb();return portIdbRequest(db.transaction(PORT_PHOTO_STORE,'readonly').objectStore(PORT_PHOTO_STORE).get(photoId))}
async function portPhotoBlobDelete(photoId){if(portPhotoStoreOverride)return portPhotoStoreOverride.delete(photoId);const db=await openPortPhotoDb(),tx=db.transaction(PORT_PHOTO_STORE,'readwrite'),done=portIdbTransaction(tx);await Promise.all([portIdbRequest(tx.objectStore(PORT_PHOTO_STORE).delete(photoId)),done])}
async function portPhotoBlobKeys(){if(portPhotoStoreOverride)return portPhotoStoreOverride.keys();const db=await openPortPhotoDb();return portIdbRequest(db.transaction(PORT_PHOTO_STORE,'readonly').objectStore(PORT_PHOTO_STORE).getAllKeys())}
function portDataUrlToBlob(data){const match=/^data:([^;,]+)(?:;[^,]*)?;base64,(.*)$/s.exec(String(data||''));if(!match)throw Error('旧写真データの形式が正しくありません');const raw=atob(match[2]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:match[1]||'image/jpeg'})}
async function portBlobToDataUrl(blob){const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let offset=0;offset<bytes.length;offset+=0x8000)binary+=String.fromCharCode(...bytes.subarray(offset,offset+0x8000));return`data:${blob.type||'image/jpeg'};base64,${btoa(binary)}`}
function portPhotoEntriesForState(state){return(state?.spans||[]).flatMap(span=>portSpanPhotoEntries(span).map(entry=>({...entry,span})))}
async function portStateWithPhotoData(state){const copy=clone(state),sourceById=new Map(portPhotoEntriesForState(state).map(entry=>[entry.photo.id,entry.photo]));for(const entry of portPhotoEntriesForState(copy)){const source=sourceById.get(entry.photo.id),data=source?.data;if(data){entry.photo.data=data;continue}const blob=await portPhotoBlobGet(entry.photo.id);if(!blob)throw Error(`写真${entry.photo.order||''}の画像本体が見つかりません`);entry.photo.data=await portBlobToDataUrl(blob)}return copy}
async function buildPortOutputDataWithPhotos(state){return buildPortOutputData(await portStateWithPhotoData(state))}
async function migrateLegacyPortPhotos(state,saveState=()=>{}){let migrated=0;for(const entry of portPhotoEntriesForState(state)){const photo=entry.photo;if(!/^data:image\//.test(String(photo.data||'')))continue;const original=photo.data,blob=portDataUrlToBlob(original);try{await portPhotoBlobPut(photo.id,blob);const verified=await portPhotoBlobGet(photo.id);if(!(verified instanceof Blob)||!verified.size)throw Error('写真の移行確認に失敗しました');delete photo.data;saveState();migrated++}catch(error){photo.data=original;throw error}}return migrated}
async function requestPortStoragePersistence(){const result={estimate:null,persisted:null};try{if(global.navigator?.storage?.estimate)result.estimate=await global.navigator.storage.estimate();if(global.navigator?.storage?.persist)result.persisted=await global.navigator.storage.persist()}catch(_){}return result}

function portProgressCriteriaRefsForStructure(structureId){
  const structure=PORT_MASTER.facilityCategories.flatMap(category=>category.structures).find(item=>item.id===structureId);
  const refs=structure?.criteriaSetRefs||[];
  if(!structure||refs.length<=1||structure.handling!=='構造別準用')return refs.slice();
  const name=structure.name||'';
  const refFacilityName=ref=>PORT_MASTER.criteriaSets[ref]?.items?.[0]?.facility||'';
  const preferred=refs.find(ref=>{
    const facility=refFacilityName(ref);
    if(!facility)return false;
    if(name.includes('矢板')&&facility.includes('矢板'))return true;
    if((name.includes('桟橋')||name.includes('ドルフィン')||name.includes('係船くい'))&&facility.includes('横桟橋'))return true;
    if((name.includes('ケーソン')||name.includes('ブロック')||name.includes('物揚場'))&&facility.includes('ケーソン'))return true;
    if((name.includes('護岸')||name.includes('堤防')||name.includes('胸壁'))&&(facility.includes('護岸')||facility.includes('堤防')))return true;
    return false;
  });
  return [preferred||refs[0]].filter(Boolean);
}
function portCriteriaSetsForStructure(structureId){
  return portProgressCriteriaRefsForStructure(structureId).map(id=>PORT_MASTER.criteriaSets[id]).filter(Boolean);

function availabilityPhotoTransaction(mode,operation){return new Promise((resolve,reject)=>{const request=indexedDB.open(AVAILABILITY_PHOTO_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(AVAILABILITY_PHOTO_STORE))request.result.createObjectStore(AVAILABILITY_PHOTO_STORE)};request.onerror=()=>reject(request.error||Error('専用写真領域を開けません'));request.onsuccess=()=>{const db=request.result,tx=db.transaction(AVAILABILITY_PHOTO_STORE,mode),store=tx.objectStore(AVAILABILITY_PHOTO_STORE);let result;try{result=operation(store)}catch(error){db.close();reject(error);return}tx.oncomplete=()=>{db.close();resolve(result?.result)};tx.onerror=()=>{db.close();reject(tx.error||Error('専用写真領域を更新できません'))}}})}
function openAvailabilityPhotoDb(){if(!global.indexedDB)return Promise.reject(Error('写真保存データベースを利用できません'));return availabilityPhotoTransaction('readonly',store=>store.count())}
function availabilityPhotoPut(id,blob){return availabilityPhotoTransaction('readwrite',store=>store.put(blob,id))}
function availabilityPhotoGet(id){return availabilityPhotoTransaction('readonly',store=>store.get(id))}
function availabilityPhotoDelete(id){return availabilityPhotoTransaction('readwrite',store=>store.delete(id))}

function availabilitySetupView(){const labels=availabilityStructureLabels(),details=availabilityDetails();return`<div class="availability-progress"><button class="active">施設設定</button><button data-availability-action="open-a">A. 構造の安定</button></div><section class="availability-hero"><span class="availability-mode-badge">港湾施設利用可否判断</span><h2>施設設定</h2><p>1係留施設単位で管理します。スパン設定は使用しません。</p></section><section class="availability-card"><h3>基本情報・構造条件</h3><div id="availability-form" class="availability-form"><label>港湾名<input data-availability-field="portName" autocomplete="off" value="${esc(availabilityState.portName)}"></label><label>施設名<input data-availability-field="facilityName" autocomplete="off" value="${esc(availabilityState.facilityName)}"></label><label>構造形式<select data-availability-field="structureType"><option value="gravity" ${availabilityState.structureType==='gravity'?'selected':''}>重力式</option><option value="sheet-pile" ${availabilityState.structureType==='sheet-pile'?'selected':''}>矢板式</option></select></label><label>詳細構造形式<select data-availability-field="detailStructureType">${details.map(([value,label])=>`<option value="${value}" ${availabilityState.detailStructureType===value?'selected':''}>${label}</option>`).join('')}</select></label>${availabilityState.detailStructureType==='other'?`<label class="availability-other">その他の詳細構造形式<input data-availability-field="detailOther" autocomplete="off" value="${esc(availabilityState.detailOther)}"></label>`:''}<label>施設延長［m］<input data-availability-field="facilityLength" type="number" min="0" step="0.1" inputmode="decimal" value="${esc(availabilityState.facilityLength)}"></label><label>${labels.crown}［m］<input data-availability-field="crownHeight" type="number" min="0" step="0.1" inputmode="decimal" value="${esc(availabilityState.crownHeight)}"></label>${availabilityDepthField('structuralDepth',labels.depth,availabilityState.structuralDepth)}${availabilityDepthField('plannedDepth','計画水深',availabilityState.plannedDepth) function availabilityDamage(value,thresholds){if(value===''||!Number.isFinite(Number(value)))return null;const number=Number(value);return number<thresholds[0]?'Ⅰ':number<thresholds[1]?'Ⅱ':number<thresholds[2]?'Ⅲ':'Ⅳ'}
function availabilityRepresentative(key){const points=availabilityState.a.measurements[key]||[],tilt=key==='G2'||key==='S4',usable=points.filter(point=>point.value!==''&&Number.isFinite(Number(point.value)));if(!usable.length)return null;const classified=tilt?usable.filter(point=>point.direction==='sea'):usable;const pool=classified.length?classified:usable;return pool.reduce((best,point)=>Number(point.value)>Number(best.value)?point:best,pool[0])}
function availabilityAssessment(){const tiltKey=availabilityState.structureType==='gravity'?'G2':'S4',displacementKey=availabilityState.structureType==='gravity'?'G3':'S5',tilt=availabilityRepresentative(tiltKey),displacement=availabilityRepresentative(displacementKey),height=availabilityHeightNumber(),tiltLevel=tilt?.direction==='sea'?availabilityDamage(tilt.value,[3,5,8]):null,ratio=displacement&&height?Number(displacement.value)/1000/height*100:null,ratioLevel=ratio==null?null:availabilityDamage(ratio,[1.5,5,10]),levels=[tiltLevel,ratioLevel].filter(Boolean),missing=[];if(!tiltLevel)missing.push(tilt?'海側への残留傾斜角未入力':'残留傾斜角未入力');if(!displacement)missing.push('残留水平変位未入力');if(displacement&&!height)missing.push('H算出不能');const level=levels.length?levels.reduce((a,b)=>AVAILABILITY_LEVELS.indexOf(a)>=AVAILABILITY_LEVELS.indexOf(b)?a:b):null,complete=!!tiltLevel&&!!ratioLevel;return{tiltKey,displacementKey,tilt,displacement,height,tiltLevel,ratio,ratioLevel,level,complete,missing}}
function availabilityMeasurementView(code,title,type){const points=availabilityState.a.measurements[code],tilt=type==='tilt',unit=tilt?'°':'mm',representative=availabilityRepresentative(code);return`<div class="availability-points">${points.map((point,index)=>`<div class="availability-point" data-availability-point="${esc(point.id)}"><label>測点名<input data-availability-point-name="${code}" data-point-id="${esc(point.id)}" value="${esc(point.name)}"></label><label>計測値<input data-availability-point-value="${code}" data-point-id="${esc(point.id)}" type="number" min="0" step="${tilt?'0.1':'1'}" inputmode="decimal" value="${esc(point.value)}" aria-label="${title} ${esc(point.name)}"></label><span class="unit">${unit}</span>${tilt?`<select data-availability-point-direction="${code}" data-point-id="${esc(point.id)}" aria-label="傾斜方向"><option value="sea" ${point.direction==='sea'?'selected':''}>海側</option><option value="land" ${point.direction==='land'?'selected':''}>陸側</option><option value="other" ${point.direction==='other'?'selected':''}>その他</option><option value="unknown" ${point.direction==='unknown'?'selected':''}>確認不能</option></select>`:''}<button type="button" class="availability-remove" data-availability-remove-point="${code}" data-point-id="${esc(point.id)}" ${points.length===1?'disabled':''}>削除</button></div>`).join('')}</div><button type="button" class="availability-add" data-availability-add-point="${code}">＋測点を追加</button>${representative?`<div class="availability-representative"><strong>危険側代表：${esc(representative.name)}</strong><br>${esc(title)}：${esc(representative.value)}${unit}${tilt?`｜${representative.direction==='sea'?'海側':representative.direction==='land'?'陸側':representative.direction==='other'?'その他':'確認不能'}`:''}</div>`:'<div class="availability-representative">危険側代表：未入力</div>'}`}

function availabilitySectionAssessment(section,items){const responses=availabilityState[section].responses,answered=items.filter(([code])=>AVAILABILITY_IMPACT.includes(responses[code])),missing=items.filter(([code])=>!AVAILABILITY_IMPACT.includes(responses[code])).map(([,title])=>title);if(!answered.length)return{level:null,label:'未判定',deciders:[],missing,provisional:false};const rank=Math.max(...answered.map(([code])=>AVAILABILITY_IMPACT.indexOf(responses[code]))),level=AVAILABILITY_IMPACT[rank],deciders=answered.filter(([code])=>responses[code]===level).map(([,title])=>title),provisional=missing.length>0;return{level,label:`${provisional?'暫定 ':''}${level}`,deciders,missing,provisional}}

function buildPortPdfHtml(data){
  const performance=data.summary.performance,
    spanHeaders=data.spans.map(span=>`<th class="span-head">No.${span.number}</th>`).join(''),
    facilityPerformance=portPerformanceLabel({rating:performance.facilityRating,status:performance.facilityStatus}),
    facilityCaution='本評価は、入力された点検結果に基づく自動一次判定です。現地条件、変状の広がり・進行性、施設性能への影響、緊急性等を総合的に確認した最終評価とは必ずしも一致しません。正式な施設全体評価は、技術者が総合的に判断してください。',
    totalDiagnosisRows=Math.max(1,performance.itemRatings.length*4);

  const spanValue=(item,span)=>{
    const entry=span.entries.find(row=>row.target.id===item.inspectionItemId);
    if(entry?.record?.skipped)return entry.record.skipReason==='該当なし'?'該当なし':'スキップ';
    const rep=item.representatives.find(row=>row.spanId===span.id);

  };

  const resultRows=performance.itemRatings.map((item,itemIndex)=>{
    const target=data.itemCounts.find(row=>row.id===item.inspectionItemId)||{},
      spanCells=data.spans.map(span=>`<td class="span-value" rowspan="4">${esc(spanValue(item,span))}</td>`).join(''),
      itemPerformance=portPerformanceLabel(item);
    return RATINGS.map((rating,index)=>`<tr>${index===0?`<td rowspan="4">${esc(target.facility||data.facility.structureName)}</td><td rowspan="4" class="center">${esc(item.classification)}</td><td rowspan="4">${esc(item.component)}</td><td rowspan="4">${esc(item.diagnosisItem)}</td><td rowspan="4">${esc(target.method||'')}</td>`:''}<td class="rating">${rating}</td><td class="criterion">${esc(target.criteria?.[rating]||'')}</td>${index===0?`${spanCells}<td class="performance-value" rowspan="4">${esc(itemPerformance)}</td>${itemIndex===0?`<td class="facility-performance-value" rowspan="${totalDiagnosisRows}"><strong>${esc(facilityPerformance)}</strong><small>一次判定</small></td>`:''}`:''}</tr>`).join('')
  }).join('');

  const allPhotoGroups=data.spans.map(span=>({span,photos:span.entries.flatMap(entry=>entry.photos.map(photoResult=>({span,photoResult})))}));

  const photoSheets=allPhotoGroups.map(group=>{
    const photoRows=Math.max(3,Math.ceil(Math.max(1,group.photos.length)/3));
    const cells=group.photos.map(({photoResult},photoIndex)=>{
      const photo=photoResult.photo,
        target=data.itemCounts.find(row=>row.id===photoResult.item?.id)||{},
        rating=RATINGS.includes(photo.rating)?photo.rating:'未判定',
        criterion=RATINGS.includes(photo.rating)?target.criteria?.[photo.rating]||'':'',
        comment=photo.conditionComment==='あり'&&photo.conditionFreeText?photo.conditionFreeText:photo.conditionComment||'';
      return`<div class="photo-cell"><div class="photo-meta-top"><div class="photo-title"><b>写真${photoIndex+1}　${esc(photoResult.component)}</b></div><div class="photo-item">${esc(photoResult.diagnosisItem)}</div><div class="photo-rating"><b>評価：${esc(rating)}</b>${criterion?`　${esc(criterion)}`:''}</div>${comment?`<div class="photo-comment">変状：${esc(comment)}</div>`:''}</div><div class="photo-image-wrap"><img src="${photo.data}" alt="写真${photoIndex+1}"></div></div>`
    }).join('');
    const blanks=Array.from({length:Math.max(0,9-group.photos.length)},()=>'<div class="photo-cell photo-cell-empty"></div>').join('');
    const value=v=>esc(v==null?'':String(v));
    return`<section class="photo-page">
      <div class="photo-page-head"><h2>写真帳</h2><span>スパンNo.${value(group.span.number)}</span></div>
      <table class="photo-info-table">
        <tr>
          <th>港湾名</th><td>${value(data.facility.portName)}</td>
          <th>施設名</th><td>${value(data.facility.facilityName)}</td>
          <th>構造形式</th><td>${value(data.facility.structureName)}</td>
          <th>総スパン数</th><td>${value(data.spans.length)}</td>
        </tr>
        <tr>
          <th>調査名称</th><td colspan="3">${value(data.facility.surveyName)}</td>
          <th>日付</th><td>${value(data.facility.inspectionDate)}</td>
          <th>スパンNo.</th><td>${value(group.span.number)}</td>
        </tr>
      </table>
      <div class="photo-grid" style="--photo-rows:${photoRows}">${cells}${blanks}</div>
    </section>`
  }).join('');

  const skips=data.summary.details.skipped.map(x=>`<tr><td>${x.span}</td><td>${esc(x.component)}</td><td>${esc(x.diagnosisItem)}</td><td>${esc(`${x.skipReason}${x.skipComment?`：${x.skipComment}`:''}`)}</td></tr>`).join('');

  return`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>港湾点検診断</title><style>
  @page{size:A3 landscape;margin:20mm}

  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #555;padding:2px 3px;vertical-align:middle}
  th{background:#e7f1e9;text-align:center;font-weight:800}
  .diagnosis-table{table-layout:fixed}
  .diagnosis-table .facility-col{width:9%}.diagnosis-table .class-col{width:4%}.diagnosis-table .component-col{width:8%}.diagnosis-table .item-col{width:11%}.diagnosis-table .method-col{width:12%}.diagnosis-table .rating-col{width:3%}.diagnosis-table .criterion-col{width:20%}
  .span-head,.span-value{width:4.5%;text-align:center;white-space:nowrap}.span-value{font-size:11px;font-weight:900}
  .performance-head,.performance-value{width:6.5%;text-align:center}.performance-value{font-size:11px;font-weight:900}
  .facility-performance-head,.facility-performance-value{width:7.5%;text-align:center}.facility-performance-value strong{display:block;font-size:18px;color:#174f32}.facility-performance-value small{display:block;margin-top:2mm;font-size:7px;color:#555}
  .rating{text-align:center;font-weight:900}.criterion{font-size:7px;line-height:1.25}.center{text-align:center}
  .group-head{background:#d5eadb;font-weight:900;text-align:center}
  .performance{margin-top:6mm}.performance strong{font-size:18px;color:#174f32}.note{font-size:8px;color:#555;line-height:1.45}
  .facility-caution{margin-top:3mm;padding:3mm;border:1px solid #c9a253;background:#fff8df;font-size:8px;line-height:1.45}
  .photo-page{page:photoPage;page-break-before:always;height:257mm;overflow:hidden}
  .photo-page-head{height:9mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #777;margin-bottom:2mm}
  .photo-page-head h2{margin:0;font-size:15px}.photo-page-head span{font-size:9px}
  .photo-info-table{height:18mm;margin-bottom:2mm;table-layout:fixed;font-size:7px}
  .photo-info-table th{width:8%;padding:1mm;background:#e7f1e9;white-space:nowrap}
  .photo-info-table td{padding:1mm;min-width:0;overflow:hidden}
  .photo-grid{height:224mm;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(var(--photo-rows,3),minmax(0,1fr));gap:3mm;align-items:stretch}
  .photo-cell{min-width:0;min-height:0;width:100%;max-width:100%;height:100%;overflow:hidden;border:1px solid #777;padding:2mm;display:grid;grid-template-rows:24mm minmax(0,1fr);background:#fff;break-inside:avoid}
  .photo-cell-empty{background:#fafafa}
  .photo-meta-top{height:24mm;min-height:24mm;max-height:24mm;overflow:hidden;padding-bottom:1.2mm;margin-bottom:1.2mm;border-bottom:1px solid #777;font-size:7px;line-height:1.2}
  .photo-meta-top b{font-size:8px}
  .photo-title,.photo-item,.photo-rating,.photo-comment{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .photo-title{white-space:nowrap}
  .photo-item{margin-top:.5mm;white-space:nowrap}
  .photo-rating{margin-top:.5mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .photo-comment{margin-top:.5mm;color:#444;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .photo-image-wrap{min-width:0;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f3f3f3}
  .photo-image-wrap img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  .page{page-break-before:always}
  </style></head><body>
  <h1>港湾施設一般定期点検診断</h1>
  <p class="facility-info">${esc(data.facility.portName)}｜${esc(data.facility.facilityName)}｜${esc(data.facility.structureName)}｜調査年月日 ${esc(data.facility.inspectionDate||'')}｜調査者 ${esc([data.facility.inspectorOrganization,data.facility.inspectorName].filter(Boolean).join(' '))}</p>
  <table class="diagnosis-table">
    <thead>
      <tr><th colspan="7" class="group-head">調査結果記入欄・劣化度の判断基準</th><th colspan="${Math.max(1,data.spans.length)}" class="group-head">スパン毎の老朽化度の評価</th><th class="group-head">点検項目</th><th class="group-head">施設全体</th></tr>
      <tr><th class="facility-col">対象施設</th><th class="class-col">分類</th><th class="component-col">部材</th><th class="item-col">点検診断項目</th><th class="method-col">点検方法</th><th class="rating-col">劣化度</th><th class="criterion-col">劣化度の判断基準</th>${spanHeaders}<th class="performance-head">性能低下度<br>A～D<br>（一次判定）</th><th class="facility-performance-head">性能低下度<br>A～D<br>（一次判定）</th></tr>
    </thead>

  </table>
  <section class="performance">
    <div class="facility-caution"><b>注意：</b>${esc(facilityCaution)}</div>
  </section>
  ${photoSheets}
  <section class="page"><h2>スキップ記録</h2><table><tr><th>スパン</th><th>部材</th><th>点検診断項目</th><th>理由</th></tr>${skips}</table></section>

}
