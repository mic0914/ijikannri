function normalize(v){let s=String(v).normalize('NFKC').replace(/[−―ーｰ–—]/g,'-').replace(/,/g,'').replace(/[^0-9.\-]/g,'');const neg=s.includes('-');s=s.replace(/-/g,'');const i=s.indexOf('.');if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,'');s=(neg?'-':'')+s;return['','-','.','-.'].includes(s)?'':Number.isFinite(+s)?s:''}

document.addEventListener('click',e=>{const img=e.target.closest?.('.photo>img');if(img){openViewer(img.src);return}if(e.target.id==='viewer-close'||e.target.id==='photo-viewer'){closeViewer();return}if(e.target.id==='viewer-plus'){viewerScale*=1.4;applyViewer();return}if(e.target.id==='viewer-minus'){viewerScale/=1.4;applyViewer();return}if(e.target.id==='viewer-reset'){viewerScale=1;applyViewer()} });
const pdfPageOriginal=pdfPage;pdfPage=(...args)=>pdfPageOriginal(...args).replaceAll('<img src=','<img style="width:100%;height:100%;object-fit:cover;object-position:center" src=');
$('#export-pdf').onclick=async()=>{if(await verifyLimitedSession('PDF出力'))exportPdf()};
$('#print').onclick=async()=>{if(await verifyLimitedSession('画面印刷'))window.print()};
let limitedDeviceId='',limitedSessionActive=!LIMITED,limitedTimer=0;
function showLimitedGate(message,error=false){let gate=$('#limited-gate');if(!gate){document.body.insertAdjacentHTML('beforeend','<div id="limited-gate" class="limited-gate"><div class="limited-gate-card"><h2 id="limited-gate-title">サーバー確認中</h2><p id="limited-gate-message">利用資格を確認しています…</p><button id="limited-retry" class="btn gold" type="button">再確認</button><p class="foot">Ver.14.9</p></div></div>');gate=$('#limited-gate');$('#limited-retry').addEventListener('click',()=>registerLimitedVisitor())}gate.hidden=false;gate.querySelector('.limited-gate-card').classList.toggle('error',error);$('#limited-gate-title').textContent=error?'確認できません':'サーバー確認中';$('#limited-gate-message').textContent=message;$('#limited-retry').disabled=!error}
function closeLimitedGate(){const gate=$('#limited-gate');if(gate)gate.remove()}
async function sessionRequest(path,extra={}){const controller=typeof AbortController==='function'?new AbortController():null;let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>{controller?.abort();const error=Error('サーバーの応答がありません。通信状態を確認して「再確認」を押してください。');error.name='TimeoutError';reject(error)},5000)});const request=fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:LIMITED.token,deviceId:limitedDeviceId,...extra}),...(controller?{signal:controller.signal}:{})}).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'サーバーで利用資格を確認できません');return data});try{return await Promise.race([request,timeout])}finally{clearTimeout(timer)}}
async function verifyLimitedSession(action='利用'){if(!LIMITED)return true;try{const data=await sessionRequest('/api/session');if(!data.active)throw Error('利用資格を確認できません');limitedSessionActive=true;closeLimitedGate();return true}catch(err){limitedSessionActive=false;showLimitedGate(`${action}を実行できません。${err.name==='AbortError'?'サーバーに接続できません。':err.message}`,true);return false}}
function startLimitedHeartbeat(){clearInterval(limitedTimer);limitedTimer=setInterval(()=>verifyLimitedSession('利用'),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)verifyLimitedSession('利用')})}
async function registerLimitedVisitor(){limitedDeviceId=localStorage.getItem('inspection-device-id');if(!limitedDeviceId){limitedDeviceId=crypto.randomUUID();localStorage.setItem('inspection-device-id',limitedDeviceId)}showLimitedGate('利用資格をサーバーで確認しています…');try{const current=await sessionRequest('/api/visitor');if(current.registered){limitedSessionActive=true;closeLimitedGate();startLimitedHeartbeat();return}document.body.insertAdjacentHTML('beforeend',`<div id="visitor-register" style="position:fixed;inset:0;z-index:5000;background:#123047ee;display:grid;place-items:center;padding:18px"><form id="visitor-form" style="width:min(520px,100%);background:#fff;border-radius:16px;padding:24px;color:#20313b"><h2>利用者情報の入力</h2><p>このURLの利用状況を管理者が確認するため、会社名と氏名を入力してください。</p><label>会社名<input id="visitor-company" maxlength="100" required autocomplete="organization"></label><label>氏名<input id="visitor-person" maxlength="60" required autocomplete="name"></label><p class="foot">入力情報、アクセス日時、端末種別は利用状況の管理目的で、URLの利用期限後も管理者が確認できる状態で保存されます。IPアドレスや位置情報は保存しません。</p><button class="btn gold" type="submit">同意して利用を開始</button><div id="visitor-error" class="foot" style="color:#b42318;margin-top:8px"></div></form></div>`);$('#visitor-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await sessionRequest('/api/visitor',{company:$('#visitor-company').value,person:$('#visitor-person').value});limitedSessionActive=true;$('#visitor-register').remove();closeLimitedGate();startLimitedHeartbeat();toast('利用者情報を登録しました')}catch(err){$('#visitor-error').textContent=err.message;b.disabled=false}})}catch(err){limitedSessionActive=false;showLimitedGate(err.name==='AbortError'?'サーバーに接続できないため起動できません。':err.message,true)}}
if(LIMITED){document.title='機能保全支援 ローカル点検アプリ';$('.header h1').textContent='機能保全支援 ローカル点検アプリ';const until=new Date(LIMITED.expiresAt).toLocaleString('ja-JP');document.querySelector('.privacy-notice').insertAdjacentHTML('afterend',`<section class="privacy-notice no-print" role="status"><strong>利用者（制限付）</strong><p>利用期限：${until}（サーバー時刻基準）／起動・出力時にサーバー確認を行います。</p></section>`);registerLimitedVisitor()}
try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.facilities?.length){state=x;let migrated=false;state.facilities.forEach(f=>{if(f.targetFacility==null){f.targetFacility='';migrated=true}(f.zones||[]).forEach(z=>(z.photos||[]).forEach(ph=>{if(ph.detail==null){ph.detail='';migrated=true}const converted=defectText(ph.change||'');if(ph.change!==converted){ph.change=converted;migrated=true}}));const onePointPerZone=Array.isArray(f.zones)&&Array.isArray(f.points)&&f.points.length===f.zones.length&&f.zones.every((z,i)=>{const p=f.points[i];return p&&p.number===i+1&&p.zoneId===z.id&&Math.abs(num(p.distance)-num(z.start))<.001});if(!onePointPerZone){generate(f,true);migrated=true}});state.version=VERSION;if(migrated){localStorage.setItem(KEY,JSON.stringify(state));toast('保存済みデータを最新版へ更新しました',4000)}}else throw Error()}catch(_){const f=freshFacility();generate(f,false);state.facilities=[f];state.activeFacilityId=f.id}render();
})();
