 f.zones=Array.from({length:count},(_,i)=>{const start=+(L*i/count).toFixed(4),end=+(L*(i+1)/count).toFixed(4),prev=oldZones[i];return{id:prev?.id||uid(),number:i+1,start,end,notes:prev?.notes||'',photos:prev?.photos||[]}});
 f.points=f.zones.map((z,i)=>{const prev=preserve?(oldPoints.find(p=>p.zoneId===oldZones[i]?.id)||oldPoints[i]):null;return{id:prev?.id||uid(),number:i+1,distance:z.start,zoneId:z.id,m1:prev?.m1??'',notes:prev?.notes||''}})
}
