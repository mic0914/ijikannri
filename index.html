<section class="privacy-notice no-print" role="note" aria-label="データ保存に関する注意"><strong>入力データ・写真の保存について</strong><p>入力内容と写真は、この端末のブラウザ内に保存され、外部サーバーへ自動送信されません。ブラウザの履歴・サイトデータの削除、端末やブラウザの変更によりデータが消失する場合があります。共用端末では、ほかの利用者に保存内容を閲覧される可能性があるため、使用後のデータ管理にご注意ください。必要なデータは「バックアップを作成」や「Excel出力」で定期的にバックアップしてください。</p></section>
<header class="header"><div class="header-row"><h1>維持管理計画・機能保全支援 ローカル点検アプリ 管理者用</h1><div class="tools"><span id="save-state" class="save">保存済み</span><button id="export-json" class="btn light">バックアップを作成</button><label class="btn light file-button">復元<input id="import-json" type="file" accept=".zip,application/zip,application/x-zip-compressed"></label><button id="export-excel" class="btn gold">Excel出力</button><button id="export-pdf" class="btn gold">PDF出力</button><button id="print" class="btn light">画面印刷</button><button id="reset-all" class="btn reset">リセット</button><span class="foot app-version" style="color:#dcecf2">Ver.16.7</span></div></div></header>
<div class="layout"><aside class="side"><nav id="overview-nav" class="nav"></nav><div class="facility-row"><select id="facility-select" aria-label="対象施設"></select><button id="add-facility" class="btn outline small" title="施設を追加">＋</button></div><nav id="zone-nav" class="nav"></nav></aside><main class="main"><div id="view" class="inner"></div></main></div>

 f.zones=ranges.map((range,i)=>{const sources=preserve?(i===count-1&&oldZones.length>count?oldZones.slice(i):oldZones[i]?[oldZones[i]]:[]):[],prev=sources[0],notes=[...new Set(sources.map(x=>x.notes).filter(Boolean))].join('\n'),photos=[...new Map(sources.flatMap(x=>x.photos||[]).map(x=>[x.id,x])).values()].slice(0,12);return{id:prev?.id||uid(),number:i+1,start:range.start,end:range.end,notes,photos}});
 f.points=f.zones.map((z,i)=>{const sourceZones=preserve?(i===count-1&&oldZones.length>count?oldZones.slice(i):oldZones[i]?[oldZones[i]]:[]):[],sourceIds=new Set(sourceZones.map(x=>x.id)),candidates=oldPoints.filter(p=>sourceIds.has(p.zoneId)),prev=candidates.find(p=>p.m1!==''&&p.m1!=null)||candidates[0]||null,max=candidates.filter(p=>p.m1!==''&&p.m1!=null).sort((a,b)=>Math.abs(num(b.m1))-Math.abs(num(a.m1)))[0],notes=[...new Set(candidates.map(x=>x.notes).filter(Boolean))].join('\n');return{id:prev?.id||uid(),number:i+1,distance:z.start,zoneId:z.id,m1:max?.m1??'',notes}})
}

function zoneResult(z,f){const rs=f.points.filter(p=>p.zoneId===z.id).map(p=>result(p,f));if(rs.some(r=>r.status==='許容値以上'))return{status:'抽出・利用保留',cls:'danger'};if(rs.length&&rs.every(r=>r.status==='許容値未満'))return{status:'許容値未満',cls:'ok'};return{status:'未計測',cls:'muted'}}

function normalize(v){let s=String(v).normalize('NFKC').replace(/[−―ーｰ–—]/g,'-').replace(/,/g,'').replace(/[^0-9.\-]/g,'');const neg=s.includes('-');s=s.replace(/-/g,'');const i=s.indexOf('.');if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,'');s=(neg?'-':'')+s;return['','-','.','-.'].includes(s)?'':Number.isFinite(+s)?s:''}
async function imageData(file){let source,url;try{if('createImageBitmap'in window)source=await createImageBitmap(file,{imageOrientation:'from-image'});else source=await new Promise((resolve,reject)=>{const im=new Image();url=URL.createObjectURL(file);im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('この写真形式を読み込めません'));im.src=url});const ow=source.width||source.naturalWidth,oh=source.height||source.naturalHeight;if(!ow||!oh)throw new Error('写真サイズを取得できません');const s=Math.min(1,1600/Math.max(ow,oh)),w=Math.max(1,Math.round(ow*s)),h=Math.max(1,Math.round(oh*s)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(source,0,0,w,h);const data=c.toDataURL('image/jpeg',.82);if(!data.startsWith('data:image/jpeg;base64,'))throw new Error('JPEG変換に失敗しました');return data}finally{if(url)URL.revokeObjectURL(url);if(source?.close)source.close()}}

async function issueAccessUrl(){const duration=Math.trunc(Number($('#access-duration')?.value)),unit=$('#access-unit')?.value||'days',maximum=unit==='minutes'?1440:365,status=$('#issued-expiry'),urlBox=$('#issued-url');if(!Number.isInteger(duration)||duration<1||duration>maximum){const message=unit==='minutes'?'利用制限期間は1～1440分で入力してください':'利用制限期間は1～365日で入力してください';status.textContent=message;status.style.color='var(--danger)';toast(message,4000);return}let key=localStorage.getItem('inspection-admin-key')||'';const askKey=message=>{const entered=prompt(message)||'';if(entered)localStorage.setItem('inspection-admin-key',entered);return entered};if(!key){key=askKey('Cloudflare Workerに設定した管理者キーを入力してください');if(!key){status.textContent='管理者キーが入力されていないため、URLを発行していません。';status.style.color='var(--danger)';return}}const button=$('#issue-url'),request=async currentKey=>{const response=await fetch('/api/issue',{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${currentKey}`},body:JSON.stringify({duration,unit})}),data=await response.json().catch(()=>({}));return{response,data}};button.disabled=true;button.textContent='発行中…';status.textContent='サーバーへ発行を依頼しています…';status.style.color='var(--muted)';urlBox.value='';try{let result=await request(key);if(result.response.status===401){localStorage.removeItem('inspection-admin-key');key=askKey('管理者キーが一致しません。正しい管理者キーを再入力してください');if(!key)throw new Error('管理者キーが入力されていないため、URLを発行していません。');result=await request(key)}if(result.response.status===401){localStorage.removeItem('inspection-admin-key');throw new Error('管理者キーが一致しません。Cloudflareに設定した管理者キーを確認してください。')}if(!result.response.ok)throw new Error(result.data.error||`URLを発行できませんでした（HTTP ${result.response.status}）`);urlBox.value=result.data.url;status.textContent=`有効期限：${new Date(result.data.expiresAt).toLocaleString('ja-JP')}（サーバー時刻基準）`;status.style.color='var(--muted)';$('#issued-result').classList.remove('hidden');toast(`${duration}${unit==='minutes'?'分':'日'}の利用者URLを発 function buildPortPdfHtml(data){const rows=data.itemCounts.map(x=>`<tr><td>${esc(x.component)}</td><td>${esc(x.diagnosisItem)}</td><td>${esc(x.criteria.a)}</td><td>${esc(x.criteria.b)}</td><td>${esc(x.criteria.c)}</td><td>${esc(x.criteria.d)}</td><td>${x.counts.a}</td><td>${x.counts.b}</td><td>${x.counts.c}</td><td>${x.counts.d}</td><td>${x.counts.unrated}</td><td>${x.counts.skipped}</td></tr>`).join(''),performance=data.summary.performance,componentPerformance=performance.componentRatings.map(row=>`<tr><td>${esc(row.component)}</td><td>${esc(portPerformanceLabel(row))}</td><td>${esc(portPerformanceStatusLabel(row))}</td></tr>`).join(''),facilityPerformance=portPerformanceLabel({rating:performance.facilityRating,status:performance.facilityStatus}),spans=data.spans.map(span=>`<section class="page"><h2>スパン${span.number} 写真帳</h2>${span.entries.flatMap(entry=>entry.photos.map(photoResult=>{const photo=photoResult.photo;return`<article><h3>${esc(photoResult.component)}｜${esc(photoResult.diagnosisItem)}｜写真${photo.order}｜評価 ${esc(photo.rating||'未判定')}</h3><img src="${photo.data}"><p>変状コメント：${esc(photo.conditionComment||'')}　自由記載：${esc(photo.conditionFreeText||'')}</p></article>`})).join('')||'<p>写真なし</p>'}</section>`).join(''),skips=data.summary.details.skipped.map(x=>`<tr><td>${x.span}</td><td>${esc(x.component)}</td><td>${esc(x.diagnosisItem)}</td><td>${esc(`${x.skipReason}${x.skipComment?`：${x.skipComment}`:''}`)}</td></tr>`).join('');return`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>港湾点検診断</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:"Yu Gothic",sans-serif;font-size:9px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #555;padding:3px;vertical-align:top}h1,h2{color:#174f32}.performance{margin-top:8mm}.performance strong{font-size:18px;color:#174f32}.note{font-size:8px;color:#555}.page{page-break-before:always}article{break-inside:avoid;margin-bottom:10mm}img{max-width:150mm;max-height:90mm;object-fit:contain}</style></head><body><h1>点検診断・a～d評価集計</h1><p>${esc(data.facility.portName)}｜${esc(data.facility.facilityName)}｜${esc(data.facility.structureName)}</p><table><thead><tr><th>部材</th><th>点検診断項目</th><th>a判定基準</th><th>b判定基準</th><th>c判定基準</th><th>d判定基準</th><th>a判定写真数</th><th>b判定写真数</th><th>c判定写真数</th><th>d判定写真数</th><th>未評価対象数</th><th>スキップ対象数</th></tr></thead><tbody>${rows}</tbody></table><section class="performance"><h2>部材別 性能低下度（一次判定）</h2><table><tr><th>部材</th><th>点検項目A～Dの最厳値</th><th>判定状態</th></tr>${componentPerformance}</table><h2>施設全体 性能低下度（一次判定） <strong>${esc(facilityPerformance)}</strong></h2><p class="note">性能低下度は自動一次判定です。正式な総合評価・維持管理方針は、施設性能への影響、緊急性、補修の必要性等を含めて総合的に判断してください。</p></section>${spans}<section class="page"><h2>スキップ記録</h2><table><tr><th>スパン</th><th>部材</th><th>点検診断項目</th><th>理由</th></tr>${skips}</table></section></body></html>`}

return;if(action==='mode')modeChooser();if(action==='apply-setup'){resizePortSpans(portState,portState.spanCount);normalizePortState(portState);portState.view=portState.structureId?'span':'setup';savePort();renderPort()}if(action==='next'){const span=currentPortSpan(),targets=portTargetsForStructure(portState.structureId),target=currentPortTarget();if(!openPortMobileNextActions(span,target,targets)){portToast(portTargetIncompleteReason(span,target,targets));renderPort();return}renderPort()}if(action==='new-target')advancePort();if(action==='toggle-skip'){portMobileSkipOpen=!portMobileSkipOpen;renderPort()}if(action==='skip'){const reason=qs('[data-port-skip-reason]')?.value||'',comment=qs('[data-port-skip-comment]')?.value.trim()||'';if(!reason||reason==='その他'&&!comment){portToast('スキップ理由を入力してください');return}const span=currentPortSpan(),targets=portTargetsForStructure(portState.structureId),record=ensurePortInspection(span,currentPortTarget());record.skipped=true;record.skipReason=reason;record.skipComment=comment;refreshPortSpanStatuses(span,targets);portMobileSkipOpen=false;savePort();advancePort()}if(action==='backup')exportPortBackup();if(action==='excel')exportPortExcel();if(action==='pdf')exportPortPdf();if(action==='reset'&&confirm('港湾モードの保存データだけを削除します。よろしいですか？')){localStorage.removeItem(PORT_KEY);loadPort();renderPort()}});
